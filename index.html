<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deacon Al Sign Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Deacon Al Sign Generator</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="textInput">Sign Message:</label>
                <textarea id="textInput" rows="3" placeholder="Enter your message here..."></textarea>
            </div>
            
            <div class="control-row">
                <div class="control-group">
                    <label for="fontSelect">Font:</label>
                    <select id="fontSelect">
                        <option value="Arial">Arial</option>
                        <option value="Courier New">Courier</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Impact">Impact</option>
                        <option value="Comic Sans MS">Comic Sans</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="colorPicker">Text Color:</label>
                    <input type="color" id="colorPicker" value="#000000">
                </div>

                <div class="control-group">
                    <label for="fontSizeSlider">Font Size:</label>
                    <input type="range" id="fontSizeSlider" min="0.5" max="2.0" step="0.1" value="1.0">
                </div>
            </div>

            <div class="control-row">
                <div class="control-group">
                    <label for="bgSelect">Background:</label>
                    <select id="bgSelect">
                        <option value="white">White Background</option>
                        <option value="transparent">Transparent Background</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="signSelect">Sign Material:</label>
                    <select id="signSelect">
                        <option value="white">White Sign</option>
                        <option value="cardboard">Cardboard Sign</option>
                    </select>
                </div>
            </div>

            <button id="downloadBtn">Download Image</button>
            <button id="copyBtn">Copy Image</button>
        </div>

        <div class="canvas-container">
            <canvas id="signCanvas"></canvas>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
